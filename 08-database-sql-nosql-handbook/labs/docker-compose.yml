name: database-handbook

services:
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_lab_only}
      MYSQL_DATABASE: commerce
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-app_lab_only}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-app_lab_only}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d commerce"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo:
    image: mongo:8.3
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root_lab_only}
      MONGO_INITDB_DATABASE: commerce
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u root -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"quit(db.adminCommand('ping').ok ? 0 : 2)\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  mysql-data:
  postgres-data:
  mongo-data:
