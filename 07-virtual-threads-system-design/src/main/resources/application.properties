spring.application.name=virtual-threads-system-design

spring.threads.virtual.enabled=true
spring.main.keep-alive=true

spring.datasource.url=jdbc:h2:mem:virtual-threads;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=2000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,metrics,prometheus,threaddump
management.observations.key-values.lab=virtual-threads

